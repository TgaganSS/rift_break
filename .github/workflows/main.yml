name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riftbreak-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform and sync game files
        run: |
          npx cap add android
          npx cap sync android

      - name: Landscape and full screen
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          sed -i '/name="AppTheme.NoActionBar"/a\        <item name="android:windowFullscreen">true</item>' android/app/src/main/res/values/styles.xml
          grep -n "sensorLandscape" android/app/src/main/AndroidManifest.xml
          grep -n "windowFullscreen" android/app/src/main/res/values/styles.xml

      - name: Build debug APK
        working-directory: riftbreak-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: riftbreak-apk
          path: riftbreak-app/android/app/build/outputs/apk/debug/app-debug.apk
